<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Grid lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Content -->
  <g transform="translate(100, 140)">
    <!-- Flag & Title Row -->
    <text x="0" y="70" font-size="64" font-family="sans-serif">🇲🇻</text>
    <text x="90" y="70" font-size="72" font-weight="bold" fill="#ffffff" font-family="'Fira Code', -apple-system, sans-serif">DhiCode</text>
    <text x="440" y="70" font-size="56" font-weight="bold" fill="url(#accent-grad)" font-family="'Faruma', 'Faseyha', 'Noto Sans Thaana', sans-serif">ދިވެހި ކޯޑު</text>

    <!-- Subtitle -->
    <text x="0" y="150" font-size="32" fill="#94a3b8" font-family="'Faruma', 'Faseyha', 'Noto Sans Thaana', sans-serif">ދިވެހި ބަހުން ޕްރޮގްރާމްކުރުމަށް ޚާއްޞަ ޒަމާނީ ޕްރޮގްރާމިންގ ލެންގުއޭޖް</text>
    <text x="0" y="195" font-size="24" fill="#64748b" font-family="-apple-system, sans-serif">A modern, native programming language crafted for Dhivehi (Thaana) speakers</text>

    <!-- Code Preview Card -->
    <g transform="translate(0, 240)">
      <rect width="1000" height="150" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1.5"/>
      <circle cx="30" cy="30" r="6" fill="#ef4444"/>
      <circle cx="50" cy="30" r="6" fill="#f59e0b"/>
      <circle cx="70" cy="30" r="6" fill="#10b981"/>
      <text x="30" y="85" font-size="24" fill="#38bdf8" font-family="'Faruma', 'Faseyha', 'Noto Sans Thaana', monospace">ކަނޑައަޅާ ނަން = "ދިވެހިރާއްޖެ"</text>
      <text x="30" y="120" font-size="24" fill="#a7f3d0" font-family="'Faruma', 'Faseyha', 'Noto Sans Thaana', monospace">ދައްކާ "މަރުޙަބާ " + ނަން</text>
    </g>
  </g>

  <!-- Footer link -->
  <text x="100" y="580" font-size="20" fill="#64748b" font-family="'Fira Code', monospace">https://siyamex.github.io/DhiCode/</text>
  <text x="1100" y="580" text-anchor="end" font-size="20" fill="#38bdf8" font-family="'Fira Code', monospace">Open Source • CC0 Universal</text>
</svg>
